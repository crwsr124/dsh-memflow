<svg width="1600" height="840" viewBox="0 0 1600 840" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#0D1628"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#4D6BFE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4D6BFE"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#glow1)"/>
  <rect width="1600" height="840" fill="url(#glow2)"/>
  <g stroke="#7DD3FC" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="210" x2="1600" y2="210"/>
    <line x1="0" y1="420" x2="1600" y2="420"/>
    <line x1="0" y1="630" x2="1600" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="840"/>
    <line x1="800" y1="0" x2="800" y2="840"/>
    <line x1="1200" y1="0" x2="1200" y2="840"/>
  </g>

  <!-- ============ RIGHT: memory-flow visual ============ -->
  <g>
    <!-- dashed return arc (record-while-working) -->
    <path d="M 1290 700 C 1120 790, 1000 700, 1110 540" fill="none" stroke="#64748B" stroke-width="4" stroke-dasharray="12 14" stroke-linecap="round" opacity="0.85"/>

    <!-- inflow band: past session -> memory -->
    <path d="M 1000 285 C 1090 320, 1090 345, 1062 372" fill="none" stroke="url(#brand)" stroke-width="22" stroke-linecap="round" opacity="0.30" filter="url(#soft)"/>
    <path d="M 1000 285 C 1090 320, 1090 345, 1062 372" fill="none" stroke="url(#brand)" stroke-width="11" stroke-linecap="round" filter="url(#halo)"/>
    <!-- outflow band: memory -> new session -->
    <path d="M 1270 432 C 1345 490, 1340 545, 1358 578" fill="none" stroke="url(#brand)" stroke-width="22" stroke-linecap="round" opacity="0.30" filter="url(#soft)"/>
    <path d="M 1270 432 C 1345 490, 1340 545, 1358 578" fill="none" stroke="url(#brand)" stroke-width="11" stroke-linecap="round" filter="url(#halo)"/>

    <!-- floating memory dots along the streams -->
    <circle cx="1032" cy="312" r="5" fill="#22D3EE" opacity="0.95"/>
    <circle cx="1060" cy="340" r="4" fill="#7DD3FC" opacity="0.85"/>
    <circle cx="1302" cy="470" r="5" fill="#22D3EE" opacity="0.95"/>
    <circle cx="1332" cy="522" r="4" fill="#7DD3FC" opacity="0.85"/>
    <circle cx="1188" cy="650" r="4" fill="#7DD3FC" opacity="0.6"/>
    <circle cx="1130" cy="700" r="3" fill="#7DD3FC" opacity="0.5"/>

    <!-- beat labels -->
    <g>
      <circle cx="1030" cy="300" r="34" fill="#0D1526" stroke="#4D6BFE" stroke-width="2"/>
      <text x="1030" y="310" text-anchor="middle" fill="#7DD3FC" font-size="22" font-family="PingFang SC, sans-serif" font-weight="600">落盘</text>
    </g>
    <g>
      <circle cx="1302" cy="466" r="34" fill="#0D1526" stroke="#4D6BFE" stroke-width="2"/>
      <text x="1302" y="476" text-anchor="middle" fill="#7DD3FC" font-size="22" font-family="PingFang SC, sans-serif" font-weight="600">感知</text>
    </g>
    <g>
      <circle cx="1152" cy="652" r="34" fill="#0D1526" stroke="#64748B" stroke-width="2"/>
      <text x="1152" y="662" text-anchor="middle" fill="#94A3B8" font-size="22" font-family="PingFang SC, sans-serif" font-weight="600">记录</text>
    </g>

    <!-- past session card -->
    <g>
      <rect x="800" y="120" width="270" height="152" rx="18" fill="#101B33" stroke="#26375F" stroke-width="1.5"/>
      <circle cx="854" cy="180" r="7" fill="#64748B"/>
      <text x="878" y="190" fill="#64748B" font-size="22" font-family="PingFang SC, sans-serif" font-weight="600">上一个会话</text>
      <text x="842" y="238" fill="#E2E8F0" font-size="24" font-family="PingFang SC, sans-serif" font-weight="600">工作完成</text>
      <text x="842" y="264" fill="#64748B" font-size="17" font-family="PingFang SC, sans-serif">关键状态落盘 memory/</text>
    </g>

    <!-- memory folder -->
    <g filter="url(#halo)">
      <path d="M 1090 356 h 52 a 12 12 0 0 1 12 12 v 12 h -64 z" fill="url(#brand)"/>
      <rect x="1090" y="376" width="240" height="150" rx="16" fill="#121C36" stroke="#4D6BFE" stroke-width="2.5"/>
      <text x="1210" y="438" text-anchor="middle" fill="url(#brand)" font-size="40" font-family="SF Pro Display, PingFang SC, sans-serif" font-weight="800">memory/</text>
    </g>
    <g font-family="SF Pro Display, PingFang SC, sans-serif" font-size="17" font-weight="600">
      <rect x="1108" y="460" width="88" height="34" rx="17" fill="#0D1526" stroke="#26375F"/>
      <text x="1152" y="482" text-anchor="middle" fill="#7DD3FC">status.md</text>
      <rect x="1204" y="460" width="96" height="34" rx="17" fill="#0D1526" stroke="#26375F"/>
      <text x="1252" y="482" text-anchor="middle" fill="#7DD3FC">history.md</text>
      <rect x="1108" y="500" width="82" height="34" rx="17" fill="#0D1526" stroke="#26375F"/>
      <text x="1149" y="522" text-anchor="middle" fill="#7DD3FC">notes.md</text>
      <rect x="1198" y="500" width="82" height="34" rx="17" fill="#0D1526" stroke="#26375F"/>
      <text x="1239" y="522" text-anchor="middle" fill="#7DD3FC">tasks.md</text>
    </g>

    <!-- new session card -->
    <g>
      <rect x="1170" y="578" width="270" height="152" rx="18" fill="#101B33" stroke="#22D3EE" stroke-width="2"/>
      <circle cx="1224" cy="638" r="7" fill="#22D3EE"/>
      <text x="1248" y="648" fill="#22D3EE" font-size="22" font-family="PingFang SC, sans-serif" font-weight="600">新会话</text>
      <text x="1212" y="696" fill="#E2E8F0" font-size="24" font-family="PingFang SC, sans-serif" font-weight="600">感知记忆</text>
      <text x="1212" y="722" fill="#64748B" font-size="17" font-family="PingFang SC, sans-serif">无缝续接项目状态</text>
    </g>
  </g>

  <!-- ============ LEFT: title ============ -->
  <g>
    <rect x="80" y="96" rx="26" width="352" height="52" fill="#0F1B36" stroke="#26375F" stroke-width="1.5"/>
    <text x="256" y="130" text-anchor="middle" fill="#7DD3FC" font-size="23" font-family="SF Pro Display, PingFang SC, sans-serif" font-weight="600" letter-spacing="2">DeepSeek Harness · PLUGIN</text>

    <text x="76" y="300" fill="url(#brand)" font-size="128" font-weight="800" font-family="SF Pro Display, PingFang SC, sans-serif" letter-spacing="1">MEMFLOW</text>
    <text x="82" y="408" fill="#F1F5F9" font-size="62" font-weight="600" font-family="PingFang SC, sans-serif">记忆流模式</text>
    <text x="82" y="494" fill="#94A3B8" font-size="40" font-weight="500" font-family="PingFang SC, sans-serif">会话会结束，记忆不会</text>
    <text x="82" y="576" fill="#64748B" font-size="30" font-family="PingFang SC, sans-serif">感知先行 · 边做边记 · 落盘交接</text>
    <text x="82" y="650" fill="#475569" font-size="26" font-family="PingFang SC, sans-serif">分布式记忆架构 —— 每个项目都有自己的记忆</text>

    <line x1="82" y1="700" x2="540" y2="700" stroke="#26375F" stroke-width="1.5"/>
    <text x="82" y="740" fill="#475569" font-size="22" font-family="SF Pro Display, PingFang SC, sans-serif">one plugin · Hermes-like memory · all your workflows</text>
  </g>
</svg>
