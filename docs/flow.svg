<svg width="1400" height="780" viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#0D1628"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>

  <!-- title -->
  <text x="60" y="70" fill="#F1F5F9" font-size="34" font-weight="700" font-family="PingFang SC, sans-serif">MEMFLOW 模式 —— 记忆的循环</text>
  <text x="62" y="106" fill="#64748B" font-size="22" font-family="PingFang SC, sans-serif">会话是易逝的浪，memory/ 是常流的河 —— 每个项目目录自带记忆</text>

  <!-- loop arrows -->
  <g fill="none" stroke="url(#brand)" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)">
    <path d="M 725 146 C 830 146, 850 200, 902 249"/>
    <path d="M 990 341 C 990 440, 850 490, 725 555"/>
    <path d="M 515 555 C 410 555, 380 440, 250 341"/>
    <path d="M 250 249 C 250 180, 380 140, 515 146"/>
  </g>

  <!-- memory write/read channels (triggered, no fixed commit step) -->
  <g fill="none" stroke="#22D3EE" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round" marker-end="url(#arr)">
    <path d="M 620 509 L 620 468"/>
    <path d="M 755 380 C 800 380, 820 340, 882 298"/>
  </g>
  <text x="648" y="496" fill="#7DD3FC" font-size="19" font-family="PingFang SC, sans-serif">触发即写</text>
  <text x="790" y="355" fill="#7DD3FC" font-size="19" font-family="PingFang SC, sans-serif">快照注入</text>

  <!-- arrow labels -->
  <text x="770" y="166" fill="#7DD3FC" font-size="19" font-family="PingFang SC, sans-serif">打开项目目录</text>
  <text x="908" y="428" fill="#94A3B8" font-size="19" font-family="PingFang SC, sans-serif">开始工作</text>
  <text x="352" y="540" fill="#94A3B8" font-size="19" font-family="PingFang SC, sans-serif">会话结束</text>
  <text x="330" y="172" fill="#94A3B8" font-size="19" font-family="PingFang SC, sans-serif">下次会话续接</text>

  <!-- node cards -->
  <g font-family="PingFang SC, sans-serif">
    <!-- A: new session -->
    <rect x="515" y="100" width="210" height="92" rx="16" fill="#101B33" stroke="#22D3EE" stroke-width="2"/>
    <text x="620" y="138" text-anchor="middle" fill="#22D3EE" font-size="23" font-weight="700">① 新会话</text>
    <text x="620" y="172" text-anchor="middle" fill="#64748B" font-size="16">打开项目目录</text>

    <!-- B: perceive -->
    <rect x="885" y="249" width="210" height="92" rx="16" fill="#101B33" stroke="#4D6BFE" stroke-width="2"/>
    <text x="990" y="287" text-anchor="middle" fill="#7DD3FC" font-size="23" font-weight="700">② 感知</text>
    <text x="990" y="321" text-anchor="middle" fill="#64748B" font-size="16">记忆快照注入首条消息</text>

    <!-- C: work -->
    <rect x="515" y="509" width="210" height="92" rx="16" fill="#101B33" stroke="#4D6BFE" stroke-width="2"/>
    <text x="620" y="547" text-anchor="middle" fill="#7DD3FC" font-size="23" font-weight="700">③ 工作</text>
    <text x="620" y="581" text-anchor="middle" fill="#64748B" font-size="16">边做边记 · 该记就记</text>

    <!-- D: session ends -->
    <rect x="145" y="249" width="210" height="92" rx="16" fill="#101B33" stroke="#4D6BFE" stroke-width="2"/>
    <text x="250" y="287" text-anchor="middle" fill="#7DD3FC" font-size="23" font-weight="700">④ 会话结束</text>
    <text x="250" y="321" text-anchor="middle" fill="#64748B" font-size="16">对话消失 · 记忆留存</text>
  </g>

  <!-- center: memory folder -->
  <g filter="url(#halo)">
    <path d="M 545 318 h 46 a 10 10 0 0 1 10 10 v 10 h -56 z" fill="url(#brand)"/>
    <rect x="545" y="334" width="210" height="128" rx="14" fill="#121C36" stroke="#4D6BFE" stroke-width="2.5"/>
    <text x="650" y="388" text-anchor="middle" fill="url(#brand)" font-size="34" font-family="SF Pro Display, PingFang SC, sans-serif" font-weight="800">memory/</text>
    <text x="650" y="436" text-anchor="middle" fill="#94A3B8" font-size="17" font-family="PingFang SC, sans-serif">每个项目都有自己的记忆</text>
  </g>

  <!-- delegate strip -->
  <g>
    <rect x="60" y="645" width="1280" height="112" rx="18" fill="#101B33" stroke="#26375F" stroke-width="1.5"/>
    <rect x="88" y="668" rx="15" width="128" height="30" fill="#0D1526" stroke="#26375F"/>
    <text x="152" y="689" text-anchor="middle" fill="#7DD3FC" font-size="16" font-family="PingFang SC, sans-serif" font-weight="600">委派模式</text>

    <rect x="252" y="668" width="190" height="64" rx="12" fill="#0D1526" stroke="#4D6BFE" stroke-width="1.5"/>
    <text x="347" y="697" text-anchor="middle" fill="#E2E8F0" font-size="20" font-family="PingFang SC, sans-serif" font-weight="600">父会话</text>
    <text x="347" y="721" text-anchor="middle" fill="#64748B" font-size="14" font-family="PingFang SC, sans-serif">delegate 工具</text>

    <rect x="512" y="668" width="190" height="64" rx="12" fill="#0D1526" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="607" y="697" text-anchor="middle" fill="#E2E8F0" font-size="20" font-family="PingFang SC, sans-serif" font-weight="600">worker 子会话</text>
    <text x="607" y="721" text-anchor="middle" fill="#64748B" font-size="14" font-family="PingFang SC, sans-serif">独立上下文</text>

    <line x1="442" y1="700" x2="504" y2="700" stroke="url(#brand)" stroke-width="4" marker-end="url(#arr)"/>
    <text x="473" y="686" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="PingFang SC, sans-serif">dossier</text>

    <path d="M 702 668 C 750 630, 830 630, 880 668" fill="none" stroke="#64748B" stroke-width="3.5" stroke-dasharray="10 10" marker-end="url(#arr)"/>
    <text x="791" y="640" text-anchor="middle" fill="#94A3B8" font-size="15" font-family="PingFang SC, sans-serif">自包含总结</text>

    <text x="940" y="697" fill="#64748B" font-size="18" font-family="PingFang SC, sans-serif">dossier 机械内联：project 记忆 + context_files 必读文件</text>
    <text x="940" y="725" fill="#475569" font-size="15" font-family="PingFang SC, sans-serif">子会话与父会话共享同一 memory/，边工作边落盘</text>
  </g>
</svg>
